<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page not found — UNTU</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="https://ik.imagekit.io/xshkpkf2i/Untu/Logo%20and%20Og/UNTU%2032%20x%2032.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#0b0d12; --text:#fff; --muted:rgba(255,255,255,.72); --stroke:rgba(255,255,255,.18); --accent:#FFD233; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; display:flex; align-items:center; justify-content:center; padding:24px 16px;
      font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1000px 700px at 15% 15%, rgba(255,210,51,.08), transparent 60%),
        var(--bg);
    }
    main{ max-width:560px; text-align:center; }
    .code{ font-size:clamp(72px,18vw,140px); font-weight:900; line-height:1; color:var(--accent); margin:0; }
    h1{ font-size:clamp(22px,4vw,30px); margin:16px 0 8px; }
    p{ color:var(--muted); line-height:1.6; margin:0 0 6px; }
    nav{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:28px; }
    a{ color:var(--text); text-decoration:none; border:1px solid var(--stroke); border-radius:999px; padding:12px 20px; font-weight:700; font-size:14px; }
    a.primary{ background:var(--accent); color:#0b0d12; border-color:var(--accent); }
    a:hover{ border-color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <p lang="lv">Lapa nav atrasta. Iespējams, tā ir pārvietota vai dzēsta.</p>
    <nav>
      <a class="primary" href="/">UNTU home</a>
      <a href="/projects/fts">From Thinking to Speaking</a>
      <a href="/projects/dwcm">Daily Wellness Challenge Movement</a>
    </nav>
  </main>
</body>
</html>
